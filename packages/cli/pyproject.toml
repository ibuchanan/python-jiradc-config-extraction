[project]
name = "cli"
version = "0.1.0"
description = "Jira Data Center configuration export command"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "config",
  "jira",
]

[project.scripts]
jira-config-export = "cli.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
