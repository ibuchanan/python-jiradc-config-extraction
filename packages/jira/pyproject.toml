[project]
name = "jira"
version = "0.1.0"
description = "Jira Data Center API client and OpenAPI specification"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28.1",
  "httpx-limiter>=0.6.1",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira"]
