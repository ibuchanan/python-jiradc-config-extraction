[project]
name = "jira-dc-config-extraction"
version = "0.1.0"
description = "Extract and analyze Jira Data Center configuration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["cli", "config", "jira"]

[dependency-groups]
dev = [
  "poethepoet>=0.49.0",
  "pytest>=9.2.0",
  "ruff>=0.17.3",
  "ty>=0.0.94",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cli = { workspace = true }
config = { workspace = true }
jira = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
pythonpath = ["packages/cli/src", "packages/config/src", "packages/jira/src"]

[tool.poe.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "ty check"
test = "pytest"
check = ["format-check", "lint", "typecheck", "test"]

[tool.ruff]
src = ["packages"]
target-version = "py314"
lint.select = [
  "ANN", # flake8-annotations
  "B",   # flake8-bugbear
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "PLR", # Pylint refactor
  "PT",  # flake8-pytest-style
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ty.src]
include = ["packages"]

[tool.ty.environment]
python = ".venv"
root = ["./packages/cli/src", "./packages/cli/tests", "./packages/config/src", "./packages/jira/src"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "config", "jira"]

[tool.hatch.build.targets.wheel]
packages = ["packages/jira/src/jira"]
