[project]
name = "config"
version = "0.1.0"
description = "Typed local application credentials"
requires-python = ">=3.14"
dependencies = [
  "pydantic-settings>=2.11.0",
  "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config"]
